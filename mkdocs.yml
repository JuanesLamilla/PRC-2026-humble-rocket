site_name: "humble-rocket · PRC Data Challenge 2026"
site_description: >-
  Taxi-out time prediction at ten European airports:
  team humble-rocket's model, validation protocol and code.
# Set after the repository is published:
# site_url: https://<owner>.github.io/<repository>/
# repo_url: https://github.com/<owner>/<repository>
# repo_name: <owner>/<repository>

docs_dir: docs
exclude_docs: |
  hooks/
hooks:
  - docs/hooks/copy_manuscript.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Manuscript: manuscript.md
  - The model:
      - The final submission: 06-final-model.md
      - Problem and data: 01-problem-and-data.md
      - Validation protocol: 03-validation.md
      - The team stack: 02-method.md
  - Running the code:
      - Reproducing the submission: reproduction.md
      - Member pipeline: reference/pipeline.md
      - Blend and assembly: reference/final.md
      - Package, CLI and scripts: reference/package.md
      - Team stack reproduction: 05-reproduction.md
  - Data sources: data-sources.md
