[project]
name = "prc-challenge"
version = "0.1.0"
description = "PRC Data Challenge 2026: taxi-out time prediction at 10 European airports"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polars>=1.20",
  "pyarrow>=18",
  "duckdb>=1.1",
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "catboost>=1.2",
  "optuna>=4.0",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.15",
  "rich>=13.0",
  "matplotlib>=3.9",
  "holidays>=0.60",
]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "pyright>=1.1.400",
  "jupyterlab>=4.3",
  "jupytext>=1.16",
  "ipykernel>=6.29",
  "seaborn>=0.13",
]
# GPU-only extras (torch for NN experiments). Installed on demand: `uv sync --group nn`.
nn = [
  "torch>=2.5",
]
# Documentation site. `uv run --group docs mkdocs serve`.
docs = [
  "mkdocs-material>=9.5",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
prc = "prc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/prc/cli.py" = ["B008"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "scripts"]
exclude = [".venv", "notebooks"]
reportMissingTypeStubs = false
