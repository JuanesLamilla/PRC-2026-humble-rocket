<svg xmlns="http://www.w3.org/2000/svg" width="940" height="568" viewBox="0 0 940 568" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b8c"/>
    </marker>
    <style>
      .box { fill: #eef1f8; stroke: #4a5a9c; stroke-width: 1.2; rx: 8; }
      .final { fill: #e7efe7; stroke: #3e6b3e; stroke-width: 1.4; rx: 8; }
      .t { fill: #1f2430; font-size: 13.5px; font-weight: 600; }
      .s { fill: #3c4356; font-size: 11.5px; }
      .edge { stroke: #5b6b8c; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- row 1: data sources -->
  <rect class="box" x="10" y="14" width="290" height="54" rx="8"/>
  <text class="t" x="155" y="36" text-anchor="middle">Challenge movement tables</text>
  <text class="s" x="155" y="54" text-anchor="middle">2025 training + NM records; 2026 ranking files</text>

  <rect class="box" x="325" y="14" width="290" height="54" rx="8"/>
  <text class="t" x="470" y="36" text-anchor="middle">ADS-B ground tracks</text>
  <text class="s" x="470" y="54" text-anchor="middle">adsb.lol archives, per-departure features</text>

  <rect class="box" x="640" y="14" width="290" height="54" rx="8"/>
  <text class="t" x="785" y="36" text-anchor="middle">Open context data</text>
  <text class="s" x="785" y="54" text-anchor="middle">EUROCONTROL daily ATFM, METAR, strike calendar</text>

  <!-- row 2: feature matrix + team stack -->
  <rect class="box" x="10" y="112" width="580" height="56" rx="8"/>
  <text class="t" x="300" y="134" text-anchor="middle">Feature matrix (pipeline/, work/fm2.parquet)</text>
  <text class="s" x="300" y="152" text-anchor="middle">stand handover, NM-neighbour taxi, plan residuals, ADS-B ground columns, label-structure columns</text>

  <rect class="box" x="640" y="112" width="290" height="56" rx="8"/>
  <text class="t" x="785" y="134" text-anchor="middle">Team stack (src/prc, scripts/)</text>
  <text class="s" x="785" y="152" text-anchor="middle">member cells, cell stacks, gate; expert table</text>

  <line class="edge" x1="155" y1="68" x2="155" y2="110"/>
  <line class="edge" x1="470" y1="68" x2="430" y2="110"/>
  <line class="edge" x1="785" y1="68" x2="785" y2="110"/>
  <line class="edge" x1="640" y1="52" x2="596" y2="118"/>
  <line class="edge" x1="540" y1="68" x2="690" y2="110"/>

  <!-- row 3: member families -->
  <rect class="box" x="10" y="214" width="292" height="72" rx="8"/>
  <text class="t" x="156" y="236" text-anchor="middle">Two-stage GBMs</text>
  <text class="s" x="156" y="254" text-anchor="middle">nested stamp models: bounded offset d,</text>
  <text class="s" x="156" y="270" text-anchor="middle">schedule-default probability, then the taxi mixture</text>

  <rect class="box" x="324" y="214" width="292" height="72" rx="8"/>
  <text class="t" x="470" y="236" text-anchor="middle">Distributional transformers</text>
  <text class="s" x="470" y="254" text-anchor="middle">histogram head masked to the provable</text>
  <text class="s" x="470" y="270" text-anchor="middle">label window, plus a point mass at the default</text>

  <rect class="box" x="638" y="214" width="292" height="72" rx="8"/>
  <text class="t" x="784" y="236" text-anchor="middle">Class-structured combiner</text>
  <text class="s" x="784" y="254" text-anchor="middle">per-class components and a gate over every</text>
  <text class="s" x="784" y="270" text-anchor="middle">member; reads the team stack as one expert</text>

  <line class="edge" x1="156" y1="168" x2="156" y2="212"/>
  <line class="edge" x1="400" y1="168" x2="450" y2="212"/>
  <line class="edge" x1="560" y1="168" x2="720" y2="212"/>
  <line class="edge" x1="785" y1="168" x2="785" y2="212"/>

  <!-- row 4: blend -->
  <rect class="box" x="190" y="330" width="560" height="50" rx="8"/>
  <text class="t" x="470" y="351" text-anchor="middle">Per-lane simplex blend (final/blend.py)</text>
  <text class="s" x="470" y="369" text-anchor="middle">weights fitted month-held on 2025, one simplex per lane and month group</text>

  <line class="edge" x1="156" y1="286" x2="330" y2="328"/>
  <line class="edge" x1="470" y1="286" x2="470" y2="328"/>
  <line class="edge" x1="784" y1="286" x2="610" y2="328"/>

  <!-- row 5: corrections and rules -->
  <rect class="box" x="190" y="416" width="560" height="50" rx="8"/>
  <text class="t" x="470" y="437" text-anchor="middle">Corrections + label-free rules (final/assemble.py)</text>
  <text class="s" x="470" y="455" text-anchor="middle">feeder-arrival lateness, CDG EOBT-filing drift; window clip, rollover identity, twin cap</text>

  <line class="edge" x1="470" y1="380" x2="470" y2="414"/>

  <!-- row 6: final file -->
  <rect class="final" x="120" y="502" width="700" height="52" rx="8"/>
  <text class="t" x="470" y="523" text-anchor="middle">submissions/humble-rocket_final.parquet</text>
  <text class="s" x="470" y="541" text-anchor="middle">670,790 departures; 2025 month-held RMSE 227.40 s (191.09 s ex-rollover), leaderboard half 221.68 s</text>

  <line class="edge" x1="470" y1="466" x2="470" y2="500"/>
</svg>
