name: exp0268_r7c_realmlp_nomask_adsbtr_hp1
description: >-
  Twin: exp0256_r7c_realmlp_nomask_adsbtr (same features, head and traces-rebuilt ADS-B archive). Tuning run
  (2026-09-27): Optuna TPE on exp0227, study hp_realmlp_v1, month_jan_jul seed 1, objective the
  ordinary-lane RMSE; trials t021-t023 formed a plateau at 183.4-183.6 vs the default's 185.5 (t009, 3 layers,
  183.4). Params = t022 (the plateau centre). Selection used Jan + Jul 2025 only, so the gate reads the ten other
  months (Feb-Jun, Aug-Dec) of month_loo x 3 seeds paired vs exp0256, then the forward veto.
features: [calendar_v2, cats, fpl_deltas, throughput, runway_gaps_v2, sched_demand, regime, stand_bounds_v2, arrival_taxi_in, metar_visibility, arrival_occupancy_v2, discharge_v2, winter_ops, daylight_curfew, adsb_ground, adsb_ground_v2, fpl_updates, source_mismatch, identity_freq, feed_health, surface_queue]
mask_for_no_nm: []
target_encoding: [te_airport_runway, te_airport_stand, te_airport_stand_runway, te_airport_operator, te_airport_actype]
te_clean_labels: true
te_alpha: 20
te_stats: [mean, p10, p50, n]
cv: {scheme: month_jan_jul}
model:
  kind: realmlp
  device: cuda
  num_boost_round: 1000000
  early_stopping_rounds: 32
  params:
    n_hidden_layers: 2
    d_hidden: 512
    act: relu
    p_drop: 0.044
    learning_rate: 0.043
    lr_sched: coslog4
    weight_decay: 0.009
    batch_size: 1024
    max_epochs: 48
    plr_sigma: 0.247
    embedding_size: 16
    amp: true
target: {transform: sqrt, clip_min: 0}
mixture:
  corruption:
    types: [sched_default, rollover, stamp_early]
    train_normal_on: all
    max_depth: 6
    num_boost_round: 500
    early_stopping_rounds: 50
    stamp_early_offset_s: 1495
    normal_weight: one_minus_p
    weight_inner_splits: 2
    weight_floor: 0.0
seeds: [1, 2, 3]
tags: [hp-probe, realmlp, gpu, head, soft-weights, r7c, nn, nomask]

test_fit: full
