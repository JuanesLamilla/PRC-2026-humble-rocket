name: exp0269_r7c_realmlp_nomask_noadsb_hp1
description: >-
  Twin: exp0261_r7c_realmlp_nomask_noadsb (the no-ADS-B RealMLP expert: exp0227 minus the 21 ADS-B columns).
  Only change: the tuned RealMLP params of exp0268 (tuning trial t022), so the expert routed into
  the tuned base exp0268 is as strong as the base. Gate: paired vs exp0261 (month_loo x 3 seeds, forward),
  then routed into exp0268 and through lane + mixture + stack, gated below C = 1 h, vs v20 (clean May-Dec).
features: [calendar_v2, cats, fpl_deltas, throughput, runway_gaps_v2, sched_demand, regime, stand_bounds_v2, arrival_taxi_in, metar_visibility, arrival_occupancy_v2, discharge_v2, winter_ops, daylight_curfew, adsb_ground, adsb_ground_v2, fpl_updates, source_mismatch, identity_freq, feed_health, surface_queue]
mask_for_no_nm: []
target_encoding: [te_airport_runway, te_airport_stand, te_airport_stand_runway, te_airport_operator, te_airport_actype]
te_clean_labels: true
te_alpha: 20
te_stats: [mean, p10, p50, n]
cv: {scheme: month_jan_jul}
model:
  kind: realmlp
  device: cuda
  num_boost_round: 1000000
  early_stopping_rounds: 32
  params:
    n_hidden_layers: 2
    d_hidden: 512
    act: relu
    p_drop: 0.044
    learning_rate: 0.043
    lr_sched: coslog4
    weight_decay: 0.009
    batch_size: 1024
    max_epochs: 48
    plr_sigma: 0.247
    embedding_size: 16
    amp: true
target: {transform: sqrt, clip_min: 0}
mixture:
  corruption:
    types: [sched_default, rollover, stamp_early]
    train_normal_on: all
    max_depth: 6
    num_boost_round: 500
    early_stopping_rounds: 50
    stamp_early_offset_s: 1495
    normal_weight: one_minus_p
    weight_inner_splits: 2
    weight_floor: 0.0
seeds: [1, 2, 3]
tags: [realmlp, gpu, head, soft-weights, r7c, nn, nomask]

test_fit: full
drop_columns: [adsb_has_gnd, adsb_mvt_minus_first_move_s, adsb_mvt_minus_first_gnd_s, adsb_gnd_path_m, adsb_stop_total_s, adsb_final_hold_s, adsb_mean_gs_kt, adsb_first_seen_dist_thr_m, adsb_gnd_max_gap_s, adsb2_first_gnd_dist_stand_m, adsb2_first_move_dist_stand_m, adsb2_frac_remaining, adsb2_pre_move_stationary_s, adsb2_n_pre_stationary, adsb2_saw_stationary, adsb2_pushback_dur_s, adsb2_pushback_path_m, adsb2_pushback_disp_m, adsb2_pushback_mean_gs_kt, adsb2_mvt_minus_taxi_start_s, adsb2_mvt_minus_last_still_s]
