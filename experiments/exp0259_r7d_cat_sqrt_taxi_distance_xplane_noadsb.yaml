name: exp0259_r7d_cat_sqrt_taxi_distance_xplane_noadsb
description: >-
  Class: ordinary. Twin: exp0250_r7d_cat_sqrt_taxi_distance_xplane. The no-ground-track expert: exp0250
  with the 21 ADS-B ground-track columns dropped (keeps adsb_matched, adsb2_stand_known,
  adsb2_stand_thr_dist_m). Used only routed to rows without a ground track or as a stack member
  with the ADS-B-state cell key (LIRF has no ground feed in July 2026).
features: [calendar_v2, cats, fpl_deltas, throughput, runway_gaps_v2, sched_demand, regime, stand_bounds_v2, arrival_taxi_in, metar_visibility, arrival_occupancy_v2, discharge_v2, winter_ops, daylight_curfew, adsb_ground, adsb_ground_v2, fpl_updates, source_mismatch, identity_freq, feed_health, surface_queue, taxi_distance, stand_xplane]
mask_for_no_nm: [stand_bounds_v2, arrival_taxi_in, metar_visibility, arrival_occupancy_v2, winter_ops, feed_health, identity_freq]
drop_columns: [td_apron, td_stand_matched, td_runway_matched, adsb_has_gnd, adsb_mvt_minus_first_move_s, adsb_mvt_minus_first_gnd_s, adsb_gnd_path_m, adsb_stop_total_s, adsb_final_hold_s, adsb_mean_gs_kt, adsb_first_seen_dist_thr_m, adsb_gnd_max_gap_s, adsb2_first_gnd_dist_stand_m, adsb2_first_move_dist_stand_m, adsb2_frac_remaining, adsb2_pre_move_stationary_s, adsb2_n_pre_stationary, adsb2_saw_stationary, adsb2_pushback_dur_s, adsb2_pushback_path_m, adsb2_pushback_disp_m, adsb2_pushback_mean_gs_kt, adsb2_mvt_minus_taxi_start_s, adsb2_mvt_minus_last_still_s]
target_encoding: []
cv: {scheme: month_jan_jul}
model:
  kind: cat
  device: cuda
  num_boost_round: 20000
  early_stopping_rounds: 200
  params:
    learning_rate: 0.02
    depth: 10
    grow_policy: Depthwise
    min_data_in_leaf: 100
target: {transform: sqrt, clip_min: 0}
mixture:
  corruption:
    types: [sched_default, rollover, stamp_early]
    train_normal_on: all
    max_depth: 6
    num_boost_round: 500
    early_stopping_rounds: 50
    stamp_early_offset_s: 1495
    normal_weight: one_minus_p
    weight_inner_splits: 2
    weight_floor: 0.0
seeds: [1, 2, 3]
tags: [cat, gpu, head, soft-weights, r7d, taxi-distance, xplane]

test_fit: full
